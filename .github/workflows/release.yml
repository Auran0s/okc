name: Release

on:
  push:
    branches:
      - main

jobs:
  detect-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      skip: ${{ steps.get_version.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from merged branch name
        id: get_version
        run: |
          BRANCH=$(git log -1 --pretty=%B | grep -oP "release/\K[\d]+\.[\d]+\.[\d]+" | head -1)

          if [ -z "$BRANCH" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "version=${BRANCH}" >> $GITHUB_OUTPUT

  test:
    needs: detect-version
    if: needs.detect-version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ".[dev]"
      - run: python -m pytest

  bump:
    needs: [detect-version, test]
    if: needs.detect-version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Update pyproject.toml
        run: |
          sed -i "s/^version = \".*\"/version = \"${{ needs.detect-version.outputs.version }}\"/" pyproject.toml

      - name: Commit, tag, and create bump PR
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          VERSION="${{ needs.detect-version.outputs.version }}"
          BRANCH="chore/bump-version-to-${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "${BRANCH}"
          git add pyproject.toml
          git commit -m "chore: bump version to ${VERSION}"
          git tag "v${VERSION}"
          git push origin "${BRANCH}" --tags

          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "chore: bump version to ${VERSION}" \
            --body "Version bump automatique suite au merge de la release ${VERSION}."

          gh pr merge "${BRANCH}" --merge --delete-branch
